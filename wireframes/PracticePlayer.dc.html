<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&amp;family=Nunito:wght@400;700&amp;display=swap">
  <style>
    body { margin: 0; background: #fbfaf7; color: #262521; font-family: "Nunito", system-ui, sans-serif; }
    a { color: #262521; } a:hover { color: #6d6a63; }
    .hand { font-family: "Gaegu", "Nunito", cursive; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 6px; height: 48px; padding: 0 12px; border: 1.5px solid #262521; border-radius: 10px; background: #ffffff; font-size: 15px; box-sizing: border-box; white-space: nowrap; }
    .on { background: #262521; color: #fbfaf7; }
    .label { font-size: 12px; color: #6d6a63; letter-spacing: 0.02em; }
    .seg { display: flex; align-items: center; justify-content: center; height: 48px; font-size: 15px; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #fbfaf7; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 12px 0 4px; box-sizing: border-box;">
    <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#262521" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
    </div>
    <div class="hand" style="flex-grow: 1; font-size: 24px; font-weight: 700;">Maxie Ford</div>
    <div class="label">Practice mode · Video 1 / 3</div>
  </div>

  <div style="position: relative; height: 219px; background: #ecebe6; border-top: 1.5px solid #262521; border-bottom: 1.5px solid #262521; display: flex; align-items: center; justify-content: center;">
    <svg width="90" height="150" viewBox="0 0 90 150" fill="none" stroke="#262521" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="transform: scaleX(-1);">
      <circle cx="45" cy="20" r="12"></circle>
      <path d="M45 32v50"></path>
      <path d="M45 45l-22 18"></path>
      <path d="M45 45l24 10"></path>
      <path d="M45 82l-18 40h-10"></path>
      <path d="M45 82l14 26 18 8"></path>
    </svg>
    <div style="position: absolute; top: 10px; left: 10px; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: #262521; color: #fbfaf7; font-size: 12px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fbfaf7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"></path><path d="M8 7l-5 5 5 5z"></path><path d="M16 7l5 5-5 5z"></path></svg>
      Mirror on
    </div>
    <div style="position: absolute; top: 10px; right: 10px; height: 26px; padding: 0 10px; border-radius: 13px; background: #ffffff; border: 1.2px solid #262521; font-size: 12px; display: flex; align-items: center;">0.5x</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 16px 4px;">
    <div style="position: relative; height: 44px;">
      <div style="position: absolute; left: 0; right: 0; top: 22px; height: 4px; border-radius: 2px; background: #d6d3cb;"></div>
      <div style="position: absolute; left: 0; width: 36%; top: 22px; height: 4px; border-radius: 2px; background: #262521;"></div>
      <div style="position: absolute; left: 30%; width: 12%; top: 16px; height: 16px; border-radius: 3px; background: rgba(38, 37, 33, 0.14); border: 1.5px dashed #262521; box-sizing: border-box;"></div>
      <div style="position: absolute; left: calc(30% - 4px); top: 0; font-size: 11px; font-weight: 700;">A</div>
      <div style="position: absolute; left: calc(42% - 4px); top: 0; font-size: 11px; font-weight: 700;">B</div>
      <div style="position: absolute; left: calc(36% - 9px); top: 15px; width: 18px; height: 18px; border-radius: 9px; background: #262521; border: 2px solid #fbfaf7;"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #6d6a63; font-variant-numeric: tabular-nums;">
      <span>0:49 / 2:20</span>
      <span style="color: #262521;">Looping A 0:42 → B 0:58</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 18px; padding: 12px 16px 16px;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span class="label">Speed</span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1.5px solid #262521; border-radius: 10px; overflow: hidden; background: #ffffff;">
        <div class="seg">0.25x</div>
        <div class="seg" style="background: #262521; color: #fbfaf7;">0.5x</div>
        <div class="seg">0.75x</div>
        <div class="seg" style="border-left: 1.5px solid #262521;">1x</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span class="label">A–B loop</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
        <div class="btn on">A 0:42</div>
        <div class="btn on">B 0:58</div>
        <div class="btn">Clear</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 28px; padding: 4px 0;">
      <div style="display: flex; align-items: center; justify-content: center; width: 60px; height: 60px; border-radius: 30px; border: 1.5px solid #262521; background: #ffffff; font-size: 15px;">−5s</div>
      <div style="display: flex; align-items: center; justify-content: center; width: 76px; height: 76px; border-radius: 38px; background: #262521;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fbfaf7" stroke-width="3" stroke-linecap="round"><path d="M8 5v14"></path><path d="M16 5v14"></path></svg>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; width: 60px; height: 60px; border-radius: 30px; border: 1.5px solid #262521; background: #ffffff; font-size: 15px;">+5s</div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 14px; border: 1.5px solid #262521; border-radius: 10px; background: #ffffff;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#262521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"></path><path d="M8 7l-5 5 5 5z"></path><path d="M16 7l5 5-5 5z"></path></svg>
      <span style="flex-grow: 1; font-size: 15px;">Mirror</span>
      <div style="position: relative; width: 48px; height: 28px; border-radius: 14px; background: #262521;">
        <div style="position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 11px; background: #fbfaf7;"></div>
      </div>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 16px; border-top: 1.5px solid #262521; background: #ffffff; box-sizing: border-box;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#262521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l4 18H5z"></path><path d="M12 17l5-10"></path></svg>
    <div style="display: flex; align-items: baseline; gap: 4px;"><span class="hand" style="font-size: 28px; font-weight: 700;">80</span><span style="font-size: 12px; color: #6d6a63;">BPM</span></div>
    <span style="font-size: 12px; color: #6d6a63;">Suggested 60 – 100</span>
    <div style="margin-left: auto; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #262521;">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#262521"></path></svg>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
