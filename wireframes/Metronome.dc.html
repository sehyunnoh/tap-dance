<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&amp;family=Nunito:wght@400;700&amp;display=swap">
  <style>
    body { margin: 0; background: #fbfaf7; color: #262521; font-family: "Nunito", system-ui, sans-serif; }
    a { color: #262521; } a:hover { color: #6d6a63; }
    .hand { font-family: "Gaegu", "Nunito", cursive; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 6px; height: 48px; padding: 0 14px; border: 1.5px solid #262521; border-radius: 10px; background: #ffffff; font-size: 15px; box-sizing: border-box; white-space: nowrap; }
    .label { font-size: 12px; color: #6d6a63; letter-spacing: 0.02em; }
    .ghost { background: #d9d6ce; border-radius: 6px; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; background: #fbfaf7; overflow: hidden;">

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 16px;">
    <div class="ghost" style="width: 90px; height: 20px;"></div>
    <div class="ghost" style="width: 200px; height: 34px;"></div>
    <div class="ghost" style="height: 200px;"></div>
    <div class="ghost" style="width: 240px; height: 16px;"></div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(38, 37, 33, 0.45);"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 20px; padding: 10px 16px 20px; background: #fbfaf7; border-top: 1.5px solid #262521; border-radius: 18px 18px 0 0; box-sizing: border-box;">
    <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #b9b5ab;"></div>

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#262521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l4 18H5z"></path><path d="M12 17l5-10"></path></svg>
        <div class="hand" style="font-size: 26px; font-weight: 700;">Metronome</div>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#262521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; justify-content: center; width: 60px; height: 60px; border-radius: 30px; border: 1.5px solid #262521; background: #ffffff; font-size: 17px;">−5</div>
      <div style="display: flex; align-items: baseline; gap: 6px;">
        <span class="hand" style="font-size: 76px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums;">80</span>
        <span style="font-size: 15px; color: #6d6a63;">BPM</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; width: 60px; height: 60px; border-radius: 30px; border: 1.5px solid #262521; background: #ffffff; font-size: 17px;">+5</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="position: relative; height: 44px;">
        <div style="position: absolute; left: 0; right: 0; top: 20px; height: 4px; border-radius: 2px; background: #d6d3cb;"></div>
        <div style="position: absolute; left: 0; width: 20%; top: 20px; height: 4px; border-radius: 2px; background: #262521;"></div>
        <div style="position: absolute; left: calc(20% - 12px); top: 10px; width: 24px; height: 24px; border-radius: 12px; background: #ffffff; border: 2px solid #262521; box-sizing: border-box;"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #6d6a63;"><span>40</span><span>240</span></div>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 14px;">
      <span style="width: 22px; height: 22px; border-radius: 11px; background: #262521;"></span>
      <span style="width: 16px; height: 16px; border-radius: 8px; border: 2px solid #262521;"></span>
      <span style="width: 16px; height: 16px; border-radius: 8px; border: 2px solid #262521;"></span>
      <span style="width: 16px; height: 16px; border-radius: 8px; border: 2px solid #262521;"></span>
      <span class="label" style="margin-left: 6px;">4 beats · accent on 1</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
      <div class="btn" style="height: 56px; border-style: dashed; border-width: 2px;">Tap tempo</div>
      <div class="btn" style="height: 56px; justify-content: space-between;">
        <span>8th notes</span>
        <div style="position: relative; width: 44px; height: 26px; border-radius: 13px; background: #d6d3cb;">
          <div style="position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 10px; background: #ffffff;"></div>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span class="label">Suggested tempo for Maxie Ford</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <div class="btn">Slow · 60</div>
        <div class="btn">Normal · 100</div>
      </div>
    </div>

    <div class="btn" style="height: 56px; background: #262521; color: #fbfaf7; font-size: 17px;">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#fbfaf7"></path></svg>
      Start
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
